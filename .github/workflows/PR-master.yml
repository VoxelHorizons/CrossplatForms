name: PR

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test
        run: ./gradlew --no-daemon clean build
      - name: Verify Cumulus and Geyser APIs are not shaded
        shell: bash
        run: |
          set -euo pipefail
          for plugin in spigot/build/libs/CrossplatForms-Spigot.jar bungeecord/build/libs/CrossplatForms-BungeeCord.jar velocity/build/libs/CrossplatForms-Velocity.jar; do
            bundled="$(jar tf "$plugin" | grep -E '^org/geysermc/(cumulus|floodgate|geyser)/' || true)"
            if [ -n "$bundled" ]; then
              echo "::error file=$plugin::Provider API classes are bundled in $plugin; this causes Floodgate sendForm LinkageError."
              printf '%s\n' "$bundled"
              exit 1
            fi
            echo "Verified external Geyser/Floodgate/Cumulus APIs in $plugin"
          done
      - name: Upload plugin jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CrossplatForms
          path: |
            spigot/build/libs/CrossplatForms-Spigot.jar
            bungeecord/build/libs/CrossplatForms-BungeeCord.jar
            velocity/build/libs/CrossplatForms-Velocity.jar
          if-no-files-found: error
